name: Hello Actions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
       - main

  workflow_dispatch:
    inputs:
      person:
        description: Who should we greet?
        required: true
        default: Learner
        type: string

# Start the list of the jobs
jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "Hello, Github Actions updated!"

      - name: Show the date
        run: date

      - name: Show working directory
        run: pwd

      - name: Greet the person
        if: github.event_name == 'workflow_dispatch'
        env:
          PERSON: ${{inputs.person}}
        run: echo "Hello, $PERSON!"
